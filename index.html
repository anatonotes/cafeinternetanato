<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Café Internet – Productivity Hub</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    body { margin: 0; padding: 0; background: #000; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_PROJECT.firebaseapp.com",
      projectId: "TU_PROJECT_ID",
      storageBucket: "TU_PROJECT.appspot.com",
      messagingSenderId: "TU_SENDER_ID",
      appId: "TU_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.firestore();
    const appId = 'cafe-internet-pro';
  </script>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const BACKGROUND_URL = "https://i.postimg.cc/Hny8Y8Jr/mmm.jpg";
    const HEADER_BANNER_URL = "https://i.postimg.cc/V6nMJ1yK/jj.png";

    const REWARDS = { XP_PER_MINUTE: 5, COINS_PER_MINUTE: 10 };

    function App() {
      const [user, setUser] = useState(null);
      const [username, setUsername] = useState("");
      const [isNameSet, setIsNameSet] = useState(false);
      const [coins, setCoins] = useState(0);
      const [score, setScore] = useState(0);
      const [globalRankings, setGlobalRankings] = useState([]);

      useEffect(() => {
        auth.signInAnonymously();
        const unsub = auth.onAuthStateChanged(setUser);
        return () => unsub();
      }, []);

      useEffect(() => {
        if (!user) return;

        const userRef = db.collection('artifacts').doc(appId)
          .collection('users').doc(user.uid)
          .collection('profile').doc('data');

        userRef.get().then(async doc => {
          if (doc.exists) {
            const data = doc.data();
            setCoins(data.coins || 0);
            setScore(data.score || 0);

            if (data.username) {
              setUsername(data.username);
              setIsNameSet(true);
            }

            // 🔥 FIX 1
            await db.collection('artifacts').doc(appId)
              .collection('public').doc('data')
              .collection('rankings').doc(user.uid)
              .set({
                score: data.score || 0,
                coins: data.coins || 0,
                username: data.username || "Guest",
                userId: user.uid,
                updatedAt: Date.now()
              }, { merge: true });

          } else {
            userRef.set({ coins: 0, score: 0 });
          }
        });

        const unsubscribeRankings = db.collection('artifacts').doc(appId)
          .collection('public').doc('data')
          .collection('rankings')
          .onSnapshot(snapshot => {
            const rankings = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));

            const sorted = rankings.sort((a, b) => (b.score || 0) - (a.score || 0));
            const top5 = sorted.slice(0, 5);

            const currentUser = sorted.find(r => r.userId === user?.uid);

            let finalRankings = top5;

            if (currentUser && !top5.find(r => r.userId === user?.uid)) {
              finalRankings = [...top5, currentUser];
            }

            setGlobalRankings(finalRankings);
          });

        return () => unsubscribeRankings();
      }, [user]);

      const syncData = useCallback(async (updates) => {
        if (!user) return;

        const userRef = db.collection('artifacts').doc(appId)
          .collection('users').doc(user.uid)
          .collection('profile').doc('data');

        const rankRef = db.collection('artifacts').doc(appId)
          .collection('public').doc('data')
          .collection('rankings').doc(user.uid);

        await userRef.set(updates, { merge: true });

        await rankRef.set({
          score: updates.score ?? score,
          coins: updates.coins ?? coins,
          username: updates.username ?? username,
          userId: user.uid,
          updatedAt: Date.now()
        }, { merge: true });

      }, [user, score, coins, username]);

      const handleSetUsername = async () => {
        if (username.trim().length >= 3) {
          const clean = username.trim();
          setIsNameSet(true);

          await syncData({ username: clean });

          // 🔥 FIX 2
          await db.collection('artifacts').doc(appId)
            .collection('public').doc('data')
            .collection('rankings').doc(user.uid)
            .set({
              score: score,
              coins: coins,
              username: clean,
              userId: user.uid,
              updatedAt: Date.now()
            }, { merge: true });
        }
      };

      if (!isNameSet) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-black text-white">
            <div>
              <input value={username} onChange={e => setUsername(e.target.value)} />
              <button onClick={handleSetUsername}>Entrar</button>
            </div>
          </div>
        );
      }

      return (
        <div className="text-white p-10">
          <h1>User: {username}</h1>
          <h2>{score} XP</h2>

          <h3>Global Live Rankings (by XP)</h3>
          {globalRankings.map((r, i) => (
            <div key={r.id}>
              #{i+1} {r.username} - {r.score} XP
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
