<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Café Internet Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; overflow-x: hidden; }
    
    /* FONDO TOTALMENTE VISIBLE Y FIJO */
    .bg-fixed-main {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
        opacity: 1; /* Máxima visibilidad */
    }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 3s linear infinite; }
    .font-display { font-family: 'Black Han Sans', sans-serif; }
    .font-mono-custom { font-family: 'Space Mono', monospace; }
    
    /* Efecto para que los bloques no tapen el fondo */
    .glass-card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-blur: 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const BACKGROUND_URL = "https://i.postimg.cc/Hny8Y8Jr/mmm.jpg";
const STICKERS_LINK = "https://drive.google.com/drive/folders/1w-kdbaZF79AJQZnA66DFvJ8GVqZenckl";
const BUY_ME_COFFEE = "https://buymeacoffee.com/anatonotesp";
const STORAGE_KEY = "cafe-internet-pro-full-v3";

const PRE_STUDY_STEPS = ["Botella de agua", "Modo No Molestar", "Escritorio limpio", "Cardio 20 min"];
const SHOP_ITEMS = [
  { id: 'espresso',   name: 'Espresso',      price: 50,   icon: "☕️" },
  { id: 'mac',        name: 'MacBook',       price: 2500, icon: "💻" },
  { id: 'planta',     name: 'Planta Zen',    price: 150,  icon: "🪴" },
  { id: 'audifonos',  name: 'Audífonos',     price: 1200, icon: "🎧" },
  { id: 'croissant',  name: 'Croissant',     price: 65,   icon: "🥐" },
  { id: 'libro',      name: 'Libro',         price: 300,  icon: "📖" },
  { id: 'matcha',     name: 'Matcha Latte',  price: 65,   icon: "🍵" },
  { id: 'boba',       name: 'Boba Tea',      price: 65,   icon: "🧋" },
];

const ICONS = {
  Clock: ["M12 2a10 10 0 100 20A10 10 0 0012 2z", "M12 6v6l4 2"],
  Play: "M5 3l14 9-14 9V3z",
  Pause: ["M6 4h4v16H6z", "M14 4h4v16h-4z"],
  Bag: ["M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z", "M3 6h18", "M16 10a4 4 0 01-8 0"],
  Book: ["M4 19.5A2.5 2.5 0 016.5 17H20", "M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"],
  Plus: ["M12 5v14", "M5 12h14"]
};

const Ico = ({ name, size = 16, className = "" }) => {
  const d = ICONS[name];
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      {Array.isArray(d) ? d.map((p, i) => <path key={i} d={p} />) : <path d={d} />}
    </svg>
  );
};

function App() {
  const [username, setUsername] = useState(localStorage.getItem('cafe-user') || "");
  const [timeLeft, setTimeLeft] = useState(90 * 60);
  const [isPaused, setIsPaused] = useState(true);
  const [isRestMode, setIsRestMode] = useState(false);
  const [coins, setCoins] = useState(0);
  const [score, setScore] = useState(0);
  const [sessionEarnings, setSessionEarnings] = useState(0);
  const [tasks, setTasks] = useState([]);
  const [newTask, setNewTask] = useState("");
  const [preStudy, setPreStudy] = useState([false, false, false, false]);
  const [itemsOwned, setItemsOwned] = useState({});

  useEffect(() => {
    if (!username) {
      const name = prompt("Introduce tu Username:") || "Estudiante";
      setUsername(name);
      localStorage.setItem('cafe-user', name);
    }
  }, []);

  useEffect(() => {
    if (isPaused || timeLeft <= 0) return;
    const timer = setInterval(() => {
      setTimeLeft(t => {
        if (t % 60 === 0 && !isRestMode) {
          setCoins(c => c + 1);
          setScore(s => s + 1);
          setSessionEarnings(e => e + 1);
        }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(timer);
  }, [isPaused, timeLeft, isRestMode]);

  const handleBuy = (item) => {
    if (coins >= item.price && !itemsOwned[item.id]) {
      setCoins(coins - item.price);
      setItemsOwned({...itemsOwned, [item.id]: true});
    }
  };

  const formatTime = (s) => {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  };

  return (
    <div className="relative min-h-screen w-full flex flex-col items-center p-4 md:p-8 overflow-y-auto custom-scrollbar">
      <img src={BACKGROUND_URL} className="bg-fixed-main" alt="fondo" />
      
      {/* CAPA DE TINTE MÍNIMA */}
      <div className={`fixed inset-0 z-[-1] transition-all duration-1000 ${isRestMode ? 'bg-indigo-900/20' : 'bg-black/5'}`}></div>

      <div className="w-full max-w-5xl z-10">
        
        {/* HEADER */}
        <header className="text-center mb-10">
          <h1 className="font-display text-7xl md:text-9xl text-black drop-shadow-[0_4px_10px_rgba(255,255,255,0.5)] leading-none">
            CAFÉ INTERNET
          </h1>
          <p className="font-bold tracking-widest text-black/70 uppercase text-[10px] mt-2 italic">Productivity Hub by anatonotes</p>
        </header>

        {/* TIMER */}
        <section className="glass-card rounded-[60px] p-10 text-center mb-8 shadow-2xl">
          <div className="flex justify-center items-center gap-2 mb-4">
            <Ico name="Clock" className={isPaused ? "text-black/30" : "text-black animate-spin"} />
            <span className="text-xs font-bold uppercase tracking-widest text-black">{isRestMode ? 'Descanso' : 'Enfoque'}</span>
          </div>
          <div className="text-8xl md:text-[13rem] font-bold text-black leading-none mb-10 tabular-nums drop-shadow-md">
            {formatTime(timeLeft)}
          </div>
          <div className="flex flex-wrap justify-center gap-4">
            <button onClick={() => setIsPaused(!isPaused)} className="bg-black text-white px-14 py-4 rounded-full font-bold text-xs uppercase hover:scale-105 transition-all">
              {isPaused ? 'Iniciar' : 'Pausar'}
            </button>
            <button onClick={() => { setIsRestMode(!isRestMode); setTimeLeft(isRestMode ? 90*60 : 10*60); setIsPaused(true); setSessionEarnings(0); }} 
              className="bg-white/60 text-black px-10 py-4 rounded-full font-bold text-xs uppercase border border-white/40 hover:bg-white transition-all">
              Cambiar Modo
            </button>
          </div>
        </section>

        {/* STATS & RANKING */}
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div className="bg-black/90 p-8 rounded-[40px] shadow-2xl col-span-1 md:col-span-2 border border-blue-500/30">
            <h3 className="font-display text-2xl text-blue-400 italic mb-6 uppercase">Global Ranking</h3>
            <div className="flex items-center justify-between p-4 bg-blue-500/20 border border-blue-500/50 rounded-2xl mb-4">
              <span className="font-bold text-xs text-blue-300 italic">#TÚ</span>
              <span className="font-bold text-white uppercase">{username}</span>
              <span className="font-mono text-blue-400">{score} pts</span>
            </div>
            <div className="space-y-2 opacity-40 text-white text-[10px] font-bold uppercase">
              <div className="flex justify-between px-2"><span>01 AnatoNotes</span><span>5000 pts</span></div>
              <div className="flex justify-between px-2"><span>02 StudyGhost</span><span>3200 pts</span></div>
            </div>
          </div>
          <div className="glass-card p-8 rounded-[40px] shadow-2xl flex flex-col justify-center items-center">
            <p className="text-[10px] font-bold uppercase opacity-50 mb-2">Billetera</p>
            <div className="text-6xl font-black text-black italic">{coins}<span className="text-xl">$</span></div>
            <p className="text-[9px] font-bold mt-2 opacity-40 uppercase">+{sessionEarnings} esta sesión</p>
          </div>
        </div>

        {/* TIENDA Y STICKERS */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
          <section className="glass-card p-8 rounded-[40px]">
            <h3 className="text-xs font-bold uppercase mb-6 flex items-center gap-2"><Ico name="Bag"/> Tienda del Café</h3>
            <div className="grid grid-cols-2 gap-3">
              {SHOP_ITEMS.map(item => (
                <button key={item.id} onClick={() => handleBuy(item)} disabled={itemsOwned[item.id]}
                  className={`p-4 rounded-2xl text-left border transition-all ${itemsOwned[item.id] ? 'bg-black/10 border-transparent opacity-40' : 'bg-white/40 border-white hover:border-black'}`}>
                  <div className="text-xl mb-1">{item.icon}</div>
                  <div className="text-[10px] font-bold uppercase">{item.name}</div>
                  <div className="text-[10px] opacity-60">{item.price}$</div>
                </button>
              ))}
            </div>
          </section>
          
          <section className="bg-black/90 p-8 rounded-[40px] text-center flex flex-col justify-center items-center">
            <h3 className="text-blue-400 font-display text-2xl italic mb-4 uppercase">Stickers Gratis</h3>
            <a href={STICKERS_LINK} target="_blank" className="bg-blue-600 text-white w-full py-4 rounded-2xl font-bold text-xs uppercase hover:bg-blue-500 mb-4 transition-all">Descargar Pack</a>
            <a href={BUY_ME_COFFEE} target="_blank" className="text-white/40 text-[10px] font-bold hover:text-white uppercase italic">Apoyar a AnatoNotes ☕️</a>
          </section>
        </div>

        {/* CHECKLIST Y TAREAS */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-20">
          <div className="glass-card p-8 rounded-[40px]">
            <h4 className="text-xs font-bold uppercase mb-6 opacity-60 flex items-center gap-2"><Ico name="Book"/> Pre-Study Routine</h4>
            {PRE_STUDY_STEPS.map((s, i) => (
              <div key={i} onClick={() => {let n=[...preStudy]; n[i]=!n[i]; setPreStudy(n);}}
                className={`p-4 mb-2 rounded-2xl cursor-pointer text-[10px] font-bold uppercase transition-all ${preStudy[i] ? 'bg-black text-white' : 'bg-white/40 text-black/50 hover:bg-white/60'}`}>
                {s} {preStudy[i] && '✓'}
              </div>
            ))}
          </div>

          <div className="glass-card p-8 rounded-[40px]">
            <h4 className="text-xs font-bold uppercase mb-6 opacity-60 flex items-center gap-2"><Ico name="Plus"/> Focus Tasks</h4>
            <div className="flex gap-2 mb-4">
              <input value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==='Enter' && (setTasks([...tasks, newTask]), setNewTask(''))}
                className="bg-white/40 flex-1 rounded-xl px-4 text-[10px] font-bold outline-none border border-transparent focus:border-black uppercase" placeholder="Añadir tarea..." />
              <button onClick={()=>{if(newTask){setTasks([...tasks, newTask]); setNewTask('');}}} className="bg-black text-white px-4 rounded-xl font-bold">+</button>
            </div>
            <div className="space-y-2 overflow-y-auto max-h-40 custom-scrollbar">
              {tasks.map((t, i) => (
                <div key={i} className="text-[10px] font-bold p-3 bg-white/20 rounded-xl border border-white/20 italic uppercase text-black/70">- {t}</div>
              ))}
            </div>
          </div>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
