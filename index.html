<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Café Internet Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; overflow-x: hidden; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 3s linear infinite; }
    .font-display { font-family: 'Black Han Sans', sans-serif; }
    .font-mono-custom { font-family: 'Space Mono', monospace; }
    /* Clase para asegurar que el fondo siempre destaque */
    .bg-main-image {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
        opacity: 0.9; /* Imagen clara y visible */
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// CONFIGURACIÓN
const BACKGROUND_URL = "https://i.postimg.cc/c4jQkKLG/CAFEINTERNET.jpg";
const STORAGE_KEY = "cafe-internet-pro-data";
const PRE_STUDY_STEPS = ["Botella de agua", "Modo No Molestar", "Escritorio limpio", "Cardio 20 min"];

// Iconos simplificados
const Ico = ({ name, className = "" }) => {
  const icons = {
    Clock: "M12 2a10 10 0 100 20A10 10 0 0012 2zM12 6v6l4 2",
    Play: "M5 3l14 9-14 9V3z",
    Pause: "M6 4h4v16H6z M14 4h4v16h-4z",
    Plus: "M12 5v14 M5 12h14"
  };
  return (
    <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d={icons[name] || ""} />
    </svg>
  );
};

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
}

function App() {
  const initial = loadData() || {};

  // ESTADOS
  const [username, setUsername] = useState(initial.username || "");
  const [timeLeft, setTimeLeft] = useState(90 * 60);
  const [isPaused, setIsPaused] = useState(true);
  const [isRestMode, setIsRestMode] = useState(false);
  const [score, setScore] = useState(initial.score ?? 0);
  const [coins, setCoins] = useState(initial.coins ?? 0);
  const [tasks, setTasks] = useState(initial.tasks ?? []);
  const [newTask, setNewTask] = useState("");
  const [preStudy, setPreStudy] = useState(initial.preStudy ?? [false, false, false, false]);

  // Ranking simulado
  const [leaderboard] = useState([
    { name: "AnatoNotes", score: 5000 },
    { name: "StudyGhost", score: 3200 },
    { name: "LofiGirl", score: 2800 }
  ]);

  // Preguntar nombre al inicio
  useEffect(() => {
    if (!username) {
      const name = prompt("Escribe tu Username:") || "User_" + Math.floor(Math.random()*1000);
      setUsername(name);
    }
  }, []);

  // Guardar datos
  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ score, coins, tasks, preStudy, username }));
  }, [score, coins, tasks, preStudy, username]);

  // Timer
  useEffect(() => {
    if (isPaused || timeLeft <= 0) return;
    const timer = setInterval(() => {
      setTimeLeft(t => t - 1);
      if (!isRestMode && timeLeft % 60 === 0) {
        setScore(s => s + 1);
        setCoins(c => c + 1);
      }
    }, 1000);
    return () => clearInterval(timer);
  }, [isPaused, timeLeft]);

  const formatTime = (s) => {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  };

  const toggleMode = () => {
    const next = !isRestMode;
    setIsRestMode(next);
    setTimeLeft(next ? 10 * 60 : 90 * 60);
    setIsPaused(true);
  };

  return (
    <div className="relative min-h-screen w-full flex flex-col items-center p-4 md:p-8 custom-scrollbar overflow-y-auto">
      
      {/* IMAGEN DE FONDO - SIEMPRE VISIBLE */}
      <img src={BACKGROUND_URL} className="bg-main-image" alt="fondo" />
      
      {/* CAPA DE CONTRASTE (Suave para que no tape la imagen) */}
      <div className={`fixed inset-0 z-[-1] transition-colors duration-1000 ${isRestMode ? 'bg-indigo-900/30' : 'bg-black/20'}`}></div>

      <div className="w-full max-w-4xl relative z-10">
        
        {/* HEADER */}
        <header className="text-center mb-12">
          <h1 className="font-display text-7xl md:text-9xl text-black drop-shadow-[0_5px_15px_rgba(255,255,255,0.4)] leading-none">
            CAFÉ INTERNET
          </h1>
          <p className="font-bold tracking-[0.3em] text-black/80 uppercase text-xs mt-2">Productivity Hub</p>
        </header>

        {/* TIMER */}
        <main className="bg-white/10 backdrop-blur-md border border-white/20 rounded-[50px] p-10 text-center mb-8 shadow-2xl">
          <div className="flex justify-center items-center gap-3 mb-4">
            <Ico name="Clock" className={isPaused ? "text-black/40" : "text-black animate-spin"} />
            <span className="text-xs font-bold uppercase tracking-widest text-black">{isRestMode ? 'Descanso' : 'Estudio'}</span>
          </div>
          <div className="text-8xl md:text-[12rem] font-bold text-black leading-none mb-10 tabular-nums">
            {formatTime(timeLeft)}
          </div>
          <div className="flex flex-wrap justify-center gap-4">
            <button onClick={() => setIsPaused(!isPaused)} 
              className={`px-12 py-4 rounded-full font-bold text-xs uppercase transition-all active:scale-95 shadow-lg ${isPaused ? 'bg-black text-white' : 'bg-white text-black'}`}>
              {isPaused ? 'Iniciar' : 'Pausar'}
            </button>
            <button onClick={toggleMode} className="bg-white/40 px-8 py-4 rounded-full font-bold text-xs uppercase border border-white/20 hover:bg-white/60">
              Cambiar Modo
            </button>
          </div>
        </main>

        {/* RANKING Y STATS */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
          
          {/* RANKING */}
          <section className="bg-black text-white p-8 rounded-[40px] shadow-2xl border border-blue-500/30">
            <h3 className="font-display text-2xl text-blue-400 italic mb-6 uppercase tracking-tighter">Ranking Global</h3>
            <div className="space-y-4">
               <div className="flex items-center justify-between p-3 bg-blue-500/20 border border-blue-500/50 rounded-2xl">
                  <span className="font-bold text-xs text-blue-300">#YOU</span>
                  <span className="font-bold uppercase text-sm">{username}</span>
                  <span className="font-mono text-blue-400">{score} pts</span>
               </div>
               <div className="h-[1px] bg-white/10 w-full"></div>
               {leaderboard.map((u, i) => (
                 <div key={i} className="flex justify-between text-sm opacity-60 px-2">
                   <span>0{i+1} {u.name}</span>
                   <span className="font-mono">{u.score} pts</span>
                 </div>
               ))}
            </div>
          </section>

          {/* BILLETERA */}
          <section className="bg-white/80 backdrop-blur-xl p-8 rounded-[40px] shadow-2xl flex flex-col justify-center items-center border border-black/5">
             <p className="text-[10px] font-bold uppercase opacity-50 mb-2 tracking-widest text-black">Total Earned</p>
             <div className="text-6xl font-black text-black">{coins}<span className="text-xl ml-1">$</span></div>
             <div className="mt-4 px-4 py-1 bg-black text-white text-[10px] font-bold rounded-full uppercase tracking-tighter">Estudiante Pro</div>
          </section>

        </div>

        {/* RUTINA Y TAREAS */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-20">
            <div className="bg-white/40 backdrop-blur-md p-6 rounded-[30px] border border-white/30">
                <h4 className="text-xs font-bold uppercase mb-4 text-black">Pre-Study Checklist</h4>
                {PRE_STUDY_STEPS.map((s, i) => (
                    <div key={i} onClick={() => {
                        const n = [...preStudy]; n[i] = !n[i]; setPreStudy(n);
                    }} className={`p-3 mb-2 rounded-xl cursor-pointer text-xs font-bold transition-all ${preStudy[i] ? 'bg-black text-white' : 'bg-white/50 text-black/50'}`}>
                        {s} {preStudy[i] && '✓'}
                    </div>
                ))}
            </div>
            
            <div className="bg-white/40 backdrop-blur-md p-6 rounded-[30px] border border-white/30">
                <h4 className="text-xs font-bold uppercase mb-4 text-black">Focus Tasks</h4>
                <div className="flex gap-2 mb-4">
                    <input value={newTask} onChange={e => setNewTask(e.target.value)} className="bg-white/50 flex-1 rounded-lg px-3 text-xs outline-none border border-black/5" placeholder="Añadir tarea..." />
                    <button onClick={() => { if(newTask) { setTasks([...tasks, newTask]); setNewTask(""); } }} className="bg-black text-white p-2 rounded-lg">+</button>
                </div>
                <div className="max-h-40 overflow-y-auto custom-scrollbar">
                    {tasks.map((t, i) => (
                        <div key={i} className="text-xs font-bold p-2 border-b border-black/5 text-black/70 italic">- {t}</div>
                    ))}
                </div>
            </div>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
