<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Café Internet </title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; overflow-x: hidden; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 3s linear infinite; }
   /* FUENTE AVENIR CONDENSED HEAVY */
    .font-avenir-heavy { 
        font-family: "Avenir Next Condensed", "Avenir Next", "Arial Narrow", sans-serif; 
        font-weight: 900;
        text-transform: uppercase;
    }
    
    /* Opacidad del 50% solicitada */
    .glass-box {
        background: rgba(255, 255, 255, 0.5);
        backdrop-blur: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .dark-glass-box {
        background: rgba(0, 0, 0, 0.5);
        backdrop-blur: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const BACKGROUND_URL = "https://i.postimg.cc/c4jQkKLG/CAFEINTERNET.jpg";
const STICKERS_LINK = "https://drive.google.com/drive/folders/1w-kdbaZF79AJQZnA66DFvJ8GVqZenckl";
const BUY_ME_COFFEE = "https://buymeacoffee.com/anatonotesp";
const PRE_STUDY_STEPS = ["Botella de agua", "Modo No Molestar", "Escritorio limpio", "Cardio 20 min"];

const SHOP_ITEMS = [
  { id: 'espresso', name: 'Espresso', price: 50, icon: "☕️" },
  { id: 'mac', name: 'MacBook', price: 2500, icon: "💻" },
  { id: 'planta', name: 'Planta Zen', price: 150, icon: "🪴" },
  { id: 'audifonos', name: 'Audífonos', price: 1200, icon: "🎧" },
  { id: 'croissant', name: 'Croissant', price: 65, icon: "🥐" },
  { id: 'libro', name: 'Libro', price: 300, icon: "📖" }
];

const ICONS = {
  Clock: ["M12 2a10 10 0 100 20A10 10 0 0012 2z", "M12 6v6l4 2"],
  Play: "M5 3l14 9-14 9V3z",
  Pause: ["M6 4h4v16H6z", "M14 4h4v16h-4z"],
  Sun: ["M12 2v2", "M12 20v2", "M12 6a6 6 0 100 12A6 6 0 0012 6z"],
  Moon: "M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"
};

const Ico = ({ name, size = 16, className = "" }) => {
  const d = ICONS[name];
  if(!d) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      {Array.isArray(d) ? d.map((p, i) => <path key={i} d={p} />) : <path d={d} />}
    </svg>
  );
};

function App() {
  const [timeLeft, setTimeLeft] = useState(90 * 60);
  const [isPaused, setIsPaused] = useState(true);
  const [isRestMode, setIsRestMode] = useState(false);
  const [coins, setCoins] = useState(0);
  const [score, setScore] = useState(0);
  const [tasks, setTasks] = useState([]);
  const [preStudy, setPreStudy] = useState([false, false, false, false]);
  const [newTask, setNewTask] = useState("");
  const [itemsOwned, setItemsOwned] = useState({});

  useEffect(() => {
    if (isPaused || timeLeft <= 0) return;
    const timer = setInterval(() => {
      setTimeLeft(t => {
        if (!isRestMode && t % 60 === 0) {
            setCoins(c => c + 1);
            setScore(s => s + 1);
        }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(timer);
  }, [isPaused, timeLeft, isRestMode]);

  const formatTime = (s) => {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  };

  const handleBuy = (item) => {
    if (coins >= item.price && !itemsOwned[item.id]) {
      setCoins(coins - item.price);
      setItemsOwned({...itemsOwned, [item.id]: true});
    }
  };

  return (
    <div className="relative min-h-screen w-full flex flex-col items-center p-4 md:p-8 overflow-y-auto custom-scrollbar font-mono">
      <img src={BACKGROUND_URL} className="fixed inset-0 w-full h-full object-cover z-[-2]" alt="fondo" />
      
      <div className="w-full max-w-5xl space-y-6">
        
        {/* 1. TITULO */}
        <header className="text-center py-6">
          <h1 className="font-display text-7xl md:text-9xl text-black drop-shadow-xl">CAFÉ INTERNET</h1>
          <p className="text-[10px] font-bold tracking-[0.3em] uppercase opacity-70">Productivity Hub by AnatoNotes</p>
        </header>

        {/* 2. TIMER */}
        <section className="glass-box rounded-[40px] p-10 text-center shadow-2xl relative overflow-hidden">
          <div className="text-8xl md:text-[12rem] font-bold text-black tabular-nums leading-none mb-6">
            {formatTime(timeLeft)}
          </div>
          <div className="flex justify-center gap-4">
            <button onClick={() => setIsPaused(!isPaused)} className="bg-black text-white px-12 py-4 rounded-full font-bold text-xs uppercase transition-transform active:scale-95">
              {isPaused ? 'Iniciar' : 'Pausar'}
            </button>
          </div>
        </section>

        {/* 3. MODO */}
        <section className="glass-box rounded-3xl p-6 flex justify-between items-center px-10">
            <div className="flex items-center gap-3">
                <Ico name="Clock" className={isPaused ? "" : "animate-spin"} />
                <span className="text-xs font-bold uppercase tracking-widest">{isRestMode ? 'Modo Descanso' : 'Modo Enfoque'}</span>
            </div>
            <button onClick={() => { setIsRestMode(!isRestMode); setTimeLeft(isRestMode ? 90*60 : 10*60); setIsPaused(true); }} 
              className="bg-black/10 px-6 py-2 rounded-full hover:bg-black/20 transition-all font-bold text-[10px] uppercase flex items-center gap-2">
              <Ico name={isRestMode ? "Sun" : "Moon"} size={14} /> Cambiar
            </button>
        </section>

        {/* 4. TO DO LIST + RUTINA */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <section className="glass-box rounded-[30px] p-6">
                <h3 className="text-xs font-bold uppercase mb-4 opacity-60">Rutina Inicio</h3>
                <div className="space-y-2">
                    {PRE_STUDY_STEPS.map((s, i) => (
                        <div key={i} onClick={() => {let n=[...preStudy]; n[i]=!n[i]; setPreStudy(n);}}
                             className={`p-3 rounded-xl cursor-pointer text-[10px] font-bold uppercase transition-all ${preStudy[i] ? 'bg-black text-white' : 'bg-white/40 text-black/50 hover:bg-white/60'}`}>
                            {s} {preStudy[i] && '✓'}
                        </div>
                    ))}
                </div>
            </section>
            <section className="glass-box rounded-[30px] p-6">
                <h3 className="text-xs font-bold uppercase mb-4 opacity-60">Objetivos Focus</h3>
                <div className="flex gap-2 mb-4">
                    <input value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==='Enter' && (setTasks([...tasks, newTask]), setNewTask(""))}
                    className="bg-white/40 flex-1 rounded-xl px-4 py-2 text-xs font-bold outline-none border border-black/10 uppercase placeholder-black/30" placeholder="Nueva tarea..." />
                    <button onClick={()=>{if(newTask){setTasks([...tasks, newTask]); setNewTask("");}}} className="bg-black text-white px-6 rounded-xl font-bold">+</button>
                </div>
                <div className="space-y-2 max-h-32 overflow-y-auto custom-scrollbar">
                    {tasks.map((t, i) => (
                    <div key={i} className="text-[10px] font-bold p-3 bg-white/20 rounded-xl border border-black/5 italic uppercase">- {t}</div>
                    ))}
                </div>
            </section>
        </div>

        {/* 5. USERNAME, RANKING Y CREDITOS (Misma Fila) */}
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="glass-box p-6 rounded-2xl flex flex-col items-center justify-center">
                <span className="text-[8px] uppercase opacity-50 font-black">Usuario</span>
                <span className="font-bold text-xs uppercase tracking-tighter">ESTUDIANTE_CAFE</span>
            </div>
            <div className="dark-glass-box p-6 rounded-2xl flex flex-col items-center justify-center text-white">
                <span className="text-[8px] uppercase opacity-50 text-blue-400 font-black">Global Ranking</span>
                <span className="font-bold text-xs">#01 | {score} PTS</span>
            </div>
            <div className="glass-box p-6 rounded-2xl flex flex-col items-center justify-center">
                <span className="text-[8px] uppercase opacity-50 font-black">Development</span>
                <span className="font-bold text-[10px] uppercase italic">AnatoNotes 2026</span>
            </div>
        </div>

        {/* 6. TIENDA, GIFTHUB, STICKERS (Misma Fila) */}
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pb-12">
            <div className="glass-box p-4 rounded-2xl">
                <p className="text-[8px] uppercase font-bold mb-3 opacity-50 text-center">Billetera: {coins}$</p>
                <div className="grid grid-cols-3 gap-2">
                    {SHOP_ITEMS.slice(0,3).map(item => (
                        <button key={item.id} onClick={() => handleBuy(item)} className={`text-xl p-2 rounded-lg text-center ${itemsOwned[item.id] ? 'bg-black/10 opacity-30' : 'bg-white/20 hover:bg-white/40'}`}>
                            {item.icon}
                        </button>
                    ))}
                </div>
            </div>
            <a href={BUY_ME_COFFEE} target="_blank" className="dark-glass-box p-4 rounded-2xl flex flex-col items-center justify-center text-white hover:scale-105 transition-all">
                <span className="text-xs font-bold uppercase tracking-widest">GiftHub</span>
                <span className="text-[9px] opacity-40">APOYAR PROYECTO</span>
            </a>
            <a href={STICKERS_LINK} target="_blank" className="glass-box p-4 rounded-2xl flex flex-col items-center justify-center hover:scale-105 transition-all">
                <span className="text-xs font-bold uppercase tracking-widest">Stickers</span>
                <span className="text-[9px] opacity-40">DESCARGAR PACK</span>
            </a>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
