<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Café Internet Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }
    @keyframes wave { 0%, 100% { height: 6px; } 50% { height: 18px; } }
    .animate-wave { animation: wave 1s ease-in-out infinite; }
    @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .animate-pulse { animation: pulse-soft 2s ease-in-out infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 3s linear infinite; }
    ::selection { background: #000; color: #fff; }
    .font-display { font-family: 'Black Han Sans', sans-serif; }
    .font-mono-custom { font-family: 'Space Mono', monospace; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const BACKGROUND_URL = "https://i.postimg.cc/Hny8Y8Jr/mmm.jpg";
const STICKERS_LINK = "https://drive.google.com/drive/folders/1w-kdbaZF79AJQZnA66DFvJ8GVqZenckl";
const BUY_ME_COFFEE = "https://buymeacoffee.com/anatonotesp";
const STORAGE_KEY = "cafe-internet-pro-data";

const PRE_STUDY_STEPS = ["Botella de agua", "Modo No Molestar", "Escritorio limpio", "Cardio 20 min"];
const SHOP_ITEMS = [
  { id: 'espresso',   name: 'Espresso',      price: 50,   icon: "☕️" },
  { id: 'mac',        name: 'MacBook',       price: 2500, icon: "💻" },
  { id: 'planta',     name: 'Planta Zen',    price: 150,  icon: "🪴" },
  { id: 'audifonos',  name: 'Audífonos',     price: 1200, icon: "🎧" },
  { id: 'croissant',  name: 'Croissant',     price: 65,   icon: "🥐" },
  { id: 'libro',      name: 'Libro',         price: 300,  icon: "📖" },
  { id: 'matcha',     name: 'Matcha Latte',  price: 65,   icon: "🍵" },
  { id: 'boba',       name: 'Boba Tea',      price: 65,   icon: "🧋" },
];

// Íconos SVG
const Icon = ({ d, size = 16, className = "", fill = "none", strokeWidth = 2 }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
    fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round"
    strokeLinejoin="round" className={className}>
    {Array.isArray(d) ? d.map((p, i) => <path key={i} d={p} />) : <path d={d} />}
  </svg>
);

const ICONS = {
  Play:       "M5 3l14 9-14 9V3z",
  Pause:      ["M6 4h4v16H6z", "M14 4h4v16h-4z"],
  Trophy:     "M6 9H2V3h4m12 6h4V3h-4M6 3h12v9a6 6 0 01-12 0V3zM8 21h8m-4-3v3",
  Check:      ["M9 11l3 3L22 4", "M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"],
  Plus:       ["M12 5v14", "M5 12h14"],
  Trash:      ["M3 6h18", "M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6", "M9 6V4h6v2"],
  Download:   ["M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4", "M7 10l5 5 5-5", "M12 15V3"],
  Moon:       "M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z",
  Sun:        ["M12 2v2", "M12 20v2", "M4.22 4.22l1.42 1.42", "M18.36 18.36l1.42 1.42", "M2 12h2", "M20 12h2", "M4.22 19.78l1.42-1.42", "M18.36 5.64l1.42-1.42", "M12 6a6 6 0 100 12A6 6 0 0012 6z"],
  Book:       ["M4 19.5A2.5 2.5 0 016.5 17H20", "M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"],
  Bag:        ["M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z", "M3 6h18", "M16 10a4 4 0 01-8 0"],
  Coffee:     ["M18 8h1a4 4 0 010 8h-1", "M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z", "M6 1v3", "M10 1v3", "M14 1v3"],
  Music:      ["M9 18V5l12-2v13", "M6 21a3 3 0 100-6 3 3 0 000 6z", "M18 19a3 3 0 100-6 3 3 0 000 6z"],
  Star:       "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
  Clock:      ["M12 2a10 10 0 100 20A10 10 0 0012 2z", "M12 6v6l4 2"],
  Layout:     ["M3 3h18v18H3z", "M3 9h18", "M9 21V9"],
  Refresh:    "M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15",
  Zap:        "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
};

const Ico = ({ name, size = 16, className = "", fill }) => {
  const d = ICONS[name];
  if (!d) return null;
  return <Icon d={d} size={size} className={className} fill={fill || "none"} />;
};

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

function App() {
  const initial = loadData() || {};

  // --- NUEVO: ESTADOS PARA RANKING ---
  const [username, setUsername] = useState(initial.username || "");
  const [leaderboard, setLeaderboard] = useState([
    { name: "AnatoNotes", score: 5000 },
    { name: "StudyGhost", score: 3200 },
    { name: "CoffeeLover", score: 1500 }
  ]);

  useEffect(() => {
    if (!username) {
      const name = prompt("¡Bienvenido! Introduce tu Username para el Ranking:") || "Estudiante_Anónimo";
      setUsername(name);
      saveData({ ...loadData(), username: name });
    }
  }, [username]);
  // ------------------------------------

  const [timeLeft, setTimeLeft]       = useState(90 * 60);
  const [isPaused, setIsPaused]       = useState(true);
  const [isRestMode, setIsRestMode]   = useState(false);
  const [coins, setCoins]             = useState(initial.coins ?? 0);
  const [score, setScore]             = useState(initial.score ?? 0);
  const [tasks, setTasks]             = useState(initial.tasks ?? []);
  const [preStudy, setPreStudy]       = useState(initial.preStudy ?? new Array(PRE_STUDY_STEPS.length).fill(false));
  const [newTask, setNewTask]         = useState('');
  const [itemsOwned, setItemsOwned]   = useState(initial.itemsOwned ?? {});
  const [sessionEarnings, setSessionEarnings] = useState(0);

  useEffect(() => {
    saveData({ coins, score, tasks, preStudy, itemsOwned, username }); // Guardamos username también
  }, [coins, score, tasks, preStudy, itemsOwned, username]);

  useEffect(() => {
    if (isPaused || timeLeft <= 0) {
      if (timeLeft === 0 && !isPaused) {
        setIsPaused(true);
        if (!isRestMode) {
          setCoins(c => c + 50);
          setScore(s => s + 100);
        }
      }
      return;
    }
    const timer = setInterval(() => {
      setTimeLeft(prev => {
        const next = prev - 1;
        if (!isRestMode && next > 0 && prev % 60 === 0) {
          setCoins(c => c + 1);
          setScore(s => s + 1);
          setSessionEarnings(e => e + 1);
        }
        return next;
      });
    }, 1000);
    return () => clearInterval(timer);
  }, [isPaused, timeLeft, isRestMode]);

  const formatTime = (s) => {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  };

  const handleBuy = (item) => {
    if (coins < item.price || itemsOwned[item.id]) return;
    setItemsOwned(o => ({ ...o, [item.id]: true }));
    setCoins(c => c - item.price);
  };

  const addTask = () => {
    if (!newTask.trim()) return;
    setTasks(t => [...t, { id: Date.now(), text: newTask, completed: false }]);
    setNewTask('');
  };

  const removeTask = (id) => setTasks(t => t.filter(x => x.id !== id));

  const toggleMode = () => {
    const next = !isRestMode;
    setIsRestMode(next);
    setTimeLeft(next ? 10 * 60 : 90 * 60);
    setIsPaused(true);
    setSessionEarnings(0);
  };

  const accent = isRestMode ? 'bg-indigo-600' : 'bg-black';
  const accentText = isRestMode ? 'text-indigo-600' : 'text-black';
  const progressMax = isRestMode ? 600 : 5400;

  return (
    <div className={`fixed inset-0 overflow-hidden select-none transition-colors duration-1000 ${isRestMode ? 'text-indigo-900' : 'text-black'}`}
      style={{ fontFamily: "'Space Mono', monospace" }}>

      <img src={BACKGROUND_URL} className="absolute inset-0 w-full h-full object-cover opacity-80" alt="fondo" />
      <div className={`absolute inset-0 transition-all duration-1000 pointer-events-none ${isRestMode ? 'bg-indigo-900/40 backdrop-blur-[1px]' : 'bg-white/10'}`}></div>

      <div className="relative z-10 w-full h-full flex flex-col items-center p-4 md:p-8 overflow-y-auto custom-scrollbar">

        <header className="text-center mb-10 mt-4">
          <div className={`inline-block px-3 py-1 text-white text-xs font-bold uppercase tracking-widest mb-4 rounded-full animate-pulse transition-colors duration-500 ${accent}`}>
            Live Study Environment
          </div>
          <h1 className="font-display text-6xl md:text-9xl tracking-tighter leading-none drop-shadow-lg transition-colors duration-500"
            style={{ fontFamily: "'Black Han Sans', sans-serif", color: isRestMode ? '#312e81' : '#000' }}>
            CAFÉ INTERNET
          </h1>
          <p className="text-xs font-bold tracking-widest text-black/60 mt-2 uppercase">
            A minimalist productivity hub by anatonotes
          </p>
        </header>

        <div className="w-full max-w-5xl space-y-8">
          
          <section className="bg-transparent p-10 text-center relative overflow-hidden">
            <div className="absolute top-0 left-0 w-full h-1 bg-black/10 rounded-full">
              <div className={`h-full transition-all duration-1000 rounded-full ${accent}`}
                style={{ width: `${(timeLeft / progressMax) * 100}%` }}></div>
            </div>
            <div className="flex items-center justify-center gap-2 mb-4 pt-4">
              <Ico name="Clock" size={16} className={isPaused ? "opacity-30" : `animate-spin ${accentText}`} />
              <span className="text-xs font-bold uppercase tracking-widest text-black/60">
                {isRestMode ? 'Descanso Activo' : 'Sesión de Enfoque'}
              </span>
            </div>
            <div className={`text-8xl md:text-9xl font-bold tabular-nums leading-none tracking-tighter mb-8 drop-shadow-xl transition-colors duration-500 ${accentText}`}
              style={{ fontSize: 'clamp(80px, 15vw, 180px)' }}>
              {formatTime(timeLeft)}
            </div>
            <div className="flex flex-wrap justify-center gap-4">
              <button onClick={() => setIsPaused(p => !p)}
                className={`px-12 py-5 rounded-full font-bold text-xs uppercase flex items-center gap-3 transition-all active:scale-95 shadow-xl
                  ${isPaused ? (isRestMode ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-black text-white hover:bg-zinc-800') : 'bg-white text-red-600 border-2 border-red-200'}`}>
                <Ico name={isPaused ? "Play" : "Pause"} size={20} fill="currentColor" />
                {isPaused ? 'Iniciar' : 'Pausar'}
              </button>
              <button onClick={toggleMode}
                className="bg-white/90 backdrop-blur-sm border-2 border-black/10 px-10 py-5 rounded-full font-bold text-xs uppercase flex items-center gap-3 hover:bg-white hover:border-black transition-all shadow-xl active:scale-95">
                <Ico name={isRestMode ? "Sun" : "Moon"} size={20} className={isRestMode ? "text-orange-500" : "text-indigo-500"} />
                {isRestMode ? 'Estudio (90m)' : 'Descanso (10m)'}
              </button>
            </div>
          </section>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="bg-white/50 backdrop-blur-md p-8 rounded-[40px] border-2 border-black/5 shadow-2xl">
              <h3 className="font-bold text-xs uppercase tracking-widest mb-6 flex items-center gap-3 text-black">
                <Ico name="Book" size={16} className="text-blue-500" /> Rutina de Inicio
              </h3>
              <div className="space-y-3">
                {PRE_STUDY_STEPS.map((step, i) => (
                  <button key={i}
                    onClick={() => setPreStudy(p => { const n = [...p]; n[i] = !n[i]; return n; })}
                    className={`w-full p-4 rounded-2xl text-xs font-bold border-2 flex items-center gap-4 transition-all uppercase tracking-tight
                      ${preStudy[i] ? (isRestMode ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-black border-black text-white') : 'bg-gray-50/50 border-transparent hover:border-black/20 text-black/60'}`}>
                    {step}
                  </button>
                ))}
              </div>
            </div>
            <div className="bg-white/50 backdrop-blur-md p-8 rounded-[40px] border-2 border-black/5 shadow-2xl">
               <h3 className="font-bold text-xs uppercase tracking-widest mb-6 flex items-center gap-3 text-black">
                <Ico name="Plus" size={16} className="text-indigo-500" /> Objetivos de Hoy
              </h3>
              <div className="flex gap-2 mb-6">
                <input value={newTask} onChange={e => setNewTask(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && addTask()}
                  placeholder="Tarea nueva..."
                  className="flex-1 bg-gray-100/50 rounded-2xl px-5 py-3 text-xs font-bold outline-none border-2 border-transparent focus:border-black uppercase transition-all text-black" />
                <button onClick={addTask} className={`text-white p-4 rounded-2xl hover:scale-105 transition-all ${accent}`}>
                  <Ico name="Plus" size={20} />
                </button>
              </div>
            </div>
          </div>

          <section className={`p-10 rounded-[60px] shadow-2xl grid grid-cols-1 md:grid-cols-2 gap-10 relative overflow-hidden transition-colors duration-1000
            ${isRestMode ? 'bg-indigo-950/90 backdrop-blur-md text-white' : 'bg-black/90 backdrop-blur-md text-white'}`}>
            <div className="text-center md:text-left z-10">
              <p className="text-xs font-bold opacity-40 uppercase tracking-widest mb-1">Billetera</p>
              <div className="text-6xl font-bold italic">{coins}<span className="text-sm opacity-30">$</span></div>
            </div>
            <div className="text-center z-10">
              <p className="text-xs font-bold opacity-40 uppercase tracking-widest mb-1">Score Total</p>
              <div className={`text-6xl font-bold italic transition-colors duration-500 ${isRestMode ? 'text-indigo-400' : 'text-blue-400'}`}>{score}</div>
            </div>
          </section>

          {/* --- NUEVO: COMPONENTE DE RANKING VISUAL --- */}
          <section className="bg-black/90 backdrop-blur-xl p-8 rounded-[40px] border-2 border-blue-500/30 shadow-2xl mt-8 mb-10">
              <div className="flex items-center justify-between mb-6">
                  <h3 className="font-display text-2xl text-blue-400 italic tracking-tighter uppercase">Global Ranking</h3>
                  <div className="flex items-center gap-2">
                      <span className="relative flex h-3 w-3">
                          <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                          <span className="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                      </span>
                      <span className="text-[10px] font-bold text-white/50 uppercase tracking-widest">Live Updates</span>
                  </div>
              </div>
              <div className="space-y-3">
                  <div className="flex items-center justify-between p-4 bg-blue-600/20 border border-blue-500/50 rounded-2xl">
                      <div className="flex items-center gap-4">
                          <span className="font-black italic text-blue-400">#TÚ</span>
                          <span className="font-bold text-white uppercase text-sm">{username}</span>
                      </div>
                      <span className="font-mono text-blue-400 font-bold">{score} pts</span>
                  </div>
                  <div className="h-[1px] bg-white/10 my-4"></div>
                  {leaderboard.map((user, index) => (
                      <div key={index} className="flex items-center justify-between p-3 hover:bg-white/5 rounded-xl transition-all">
                          <div className="flex items-center gap-4">
                              <span className="font-bold text-white/30 text-xs w-4">0{index + 1}</span>
                              <span className="font-bold text-white/80 text-sm uppercase tracking-tight">{user.name}</span>
                          </div>
                          <span className="font-mono text-white/40 text-xs">{user.score} pts</span>
                      </div>
                  ))}
              </div>
          </section>
          {/* ------------------------------------------ */}

          <footer className="text-center py-20 flex flex-col items-center gap-4">
            <p className="opacity-40 text-xs font-bold uppercase tracking-widest text-black">
              © 2026 Cafe Internet Pro · Mood Responsive
            </p>
          </footer>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
