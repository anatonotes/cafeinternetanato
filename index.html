<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Café Internet – Productivity Hub</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    body { margin: 0; padding: 0; background: #000; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- ⚠️ PON AQUÍ TU CONFIGURACIÓN DE FIREBASE -->
  <script>
    const firebaseConfig = {
      apiKey:            "TU_API_KEY",
      authDomain:        "TU_PROJECT.firebaseapp.com",
      projectId:         "TU_PROJECT_ID",
      storageBucket:     "TU_PROJECT.appspot.com",
      messagingSenderId: "TU_SENDER_ID",
      appId:             "TU_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.firestore();
    const appId = 'cafe-internet-pro';
  </script>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // --- CONFIGURACIÓN Y CONSTANTES ---
    const BACKGROUND_URL = "https://i.postimg.cc/Hny8Y8Jr/mmm.jpg";
    const HEADER_BANNER_URL = "https://i.postimg.cc/V6nMJ1yK/jj.png";
    const STICKERS_LINK = "https://drive.google.com/drive/folders/1w-kdbaZF79AJQZnA66DFvJ8GVqZenckl";
    const BUY_ME_COFFEE = "https://buymeacoffee.com/anatonotesp";
    const PRE_STUDY_STEPS = ["Botella de agua", "Modo No Molestar", "Escritorio limpio", "Cardio 20 min"];

    // Configuración de Recompensas
    const REWARDS = {
      XP_PER_MINUTE: 5,
      COINS_PER_MINUTE: 10
    };

    const SHOP_ITEMS = [
      { id: 'espresso', name: 'Espresso', price: 50, icon: "☕️" },
      { id: 'mac', name: 'MacBook', price: 2500, icon: "💻" },
      { id: 'planta', name: 'Planta Zen', price: 150, icon: "🪴" },
      { id: 'audifonos', name: 'Audífonos', price: 1200, icon: "🎧" },
      { id: 'croissant', name: 'Croissant', price: 65, icon: "🥐" },
      { id: 'libro', name: 'Libro', price: 300, icon: "📖" }
    ];

    // --- ICONOS ---
    const LucideIcon = ({ name, className = "" }) => {
      const icons = {
        play: <path d="m5 3 14 9-14 9V3z" />,
        pause: <><rect width="4" height="16" x="6" y="4" /><rect width="4" height="16" x="14" y="4" /></>,
        clock: <><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></>,
        sun: <><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></>,
        moon: <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />,
        plus: <><path d="M5 12h14" /><path d="M12 5v14" /></>,
        check: <path d="M20 6 9 17l-5-5" />,
        trash: <><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></>,
        user: <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
        wallet: <><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" /><path d="M3 5v14a2 2 0 0 0 2 2h16v-5" /><path d="M18 12a2 2 0 0 0 0 4h4v-4Z" /></>
      };
      return (
        <svg 
          width={20} 
          height={20} 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          strokeWidth="2" 
          strokeLinecap="round" 
          strokeLinejoin="round" 
          className={className}
        >
          {icons[name]}
        </svg>
      );
    };

    function App() {
      const [user, setUser] = useState(null);
      const [username, setUsername] = useState("");
      const [isNameSet, setIsNameSet] = useState(false);
      const [timeLeft, setTimeLeft] = useState(90 * 60);
      const [isPaused, setIsPaused] = useState(true);
      const [isRestMode, setIsRestMode] = useState(false);
      
      // Estados de persistencia
      const [coins, setCoins] = useState(0);
      const [score, setScore] = useState(0);
      const [tasks, setTasks] = useState([]);
      const [preStudy, setPreStudy] = useState([false, false, false, false]);
      const [itemsOwned, setItemsOwned] = useState({});
      const [globalRankings, setGlobalRankings] = useState([]);
      const [newTask, setNewTask] = useState("");

      // 1. Inicialización de Auth
      useEffect(() => {
        auth.signInAnonymously().catch(err => console.error("Error de autenticación", err));
        const unsubscribe = auth.onAuthStateChanged(setUser);
        return () => unsubscribe();
      }, []);

      // 2. Hook de Persistencia de Datos
      useEffect(() => {
        if (!user) return;

        const userDocRef = db.collection('artifacts').doc(appId)
          .collection('users').doc(user.uid)
          .collection('profile').doc('data');
        
        // Carga Inicial
        userDocRef.get().then(docSnap => {
          if (docSnap.exists) {
            const data = docSnap.data();
            setCoins(data.coins || 0);
            setScore(data.score || 0);
            setTasks(data.tasks || []);
            setPreStudy(data.preStudy || [false, false, false, false]);
            setItemsOwned(data.itemsOwned || {});
            if (data.username) {
                setUsername(data.username);
                setIsNameSet(true);
            }
          } else {
            userDocRef.set({ coins: 0, score: 0, tasks: [], preStudy: [false, false, false, false], itemsOwned: {} });
          }
        });

        // Listener de Rankings Globales
        const publicDataQuery = db.collection('artifacts').doc(appId)
          .collection('public').doc('data').collection('rankings');
        const unsubscribeRankings = publicDataQuery.onSnapshot((snapshot) => {
          const rankings = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          setGlobalRankings(rankings.sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 5));
        }, (err) => console.error("Error en snapshot", err));

        return () => unsubscribeRankings();
      }, [user]);

      // Sincronización con la nube
      const syncData = useCallback(async (updates) => {
        if (!user) return;
        const userDocRef = db.collection('artifacts').doc(appId)
          .collection('users').doc(user.uid)
          .collection('profile').doc('data');
        const rankDocRef = db.collection('artifacts').doc(appId)
          .collection('public').doc('data')
          .collection('rankings').doc(user.uid);
        
        await userDocRef.update(updates).catch(() => userDocRef.set(updates, { merge: true }));
        
        if (updates.score !== undefined || updates.coins !== undefined || updates.username !== undefined) {
          await rankDocRef.set({ 
            score: updates.score ?? score, 
            coins: updates.coins ?? coins, 
            username: updates.username ?? username,
            userId: user.uid,
            updatedAt: Date.now() 
          }, { merge: true });
        }
      }, [user, score, coins, username]);

      // 3. Lógica del Temporizador con Nueva Lógica de XP y Créditos
      useEffect(() => {
        if (isPaused || timeLeft <= 0) return;
        const timer = setInterval(() => {
          setTimeLeft(t => {
            const nextTime = t - 1;
            
            // Cada 60 segundos transcurridos en modo enfoque (no descanso)
            if (!isRestMode && nextTime > 0 && nextTime % 60 === 0) {
              // Actualización Local
              setCoins(prevCoins => {
                const newC = prevCoins + REWARDS.COINS_PER_MINUTE;
                setScore(prevScore => {
                  const newS = prevScore + REWARDS.XP_PER_MINUTE;
                  // Sincronizar ambos valores al mismo tiempo para evitar desajustes
                  syncData({ coins: newC, score: newS });
                  return newS;
                });
                return newC;
              });
            }
            return nextTime;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [isPaused, isRestMode, syncData]);

      const handleSetUsername = () => {
        if (username.trim().length >= 3) {
          setIsNameSet(true);
          syncData({ username: username.trim() });
        }
      };

      const formatTime = (s) => {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
      };

      const handleBuy = async (item) => {
        if (coins >= item.price && !itemsOwned[item.id]) {
          const newCoins = coins - item.price;
          const newItems = { ...itemsOwned, [item.id]: true };
          setCoins(newCoins);
          setItemsOwned(newItems);
          await syncData({ coins: newCoins, itemsOwned: newItems });
        }
      };

      const togglePreStudy = async (index) => {
        const nextPre = [...preStudy];
        nextPre[index] = !nextPre[index];
        setPreStudy(nextPre);
        await syncData({ preStudy: nextPre });
      };

      const addTask = async () => {
        if (!newTask.trim()) return;
        const nextTasks = [...tasks, newTask];
        setTasks(nextTasks);
        setNewTask("");
        await syncData({ tasks: nextTasks });
      };

      const removeTask = async (idx) => {
        const nextTasks = tasks.filter((_, i) => i !== idx);
        setTasks(nextTasks);
        await syncData({ tasks: nextTasks });
      };

      if (!isNameSet) {
        return (
          <div className="min-h-screen w-full bg-black flex items-center justify-center p-6 font-['Avenir_Next_Condensed','Arial_Narrow',sans-serif]">
             <img src={BACKGROUND_URL} className="fixed inset-0 w-full h-full object-cover opacity-40 z-0" alt="fondo" />
             <div className="relative z-10 w-full max-w-md bg-white/90 backdrop-blur-2xl p-10 rounded-[40px] shadow-2xl border border-white/20 text-center space-y-8">
                <img src={HEADER_BANNER_URL} className="w-40 mx-auto rounded-2xl shadow-lg mb-4" alt="banner" />
                <div className="space-y-2">
                  <h2 className="text-2xl font-black tracking-tighter uppercase italic">¡BIENVENIDO AL CAFÉ!</h2>
                  <p className="text-[10px] font-bold opacity-50 uppercase tracking-[0.2em]">Ingresa tu nombre para el ranking</p>
                </div>
                <div className="space-y-4">
                  <input 
                    type="text" 
                    value={username} 
                    onChange={(e) => setUsername(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSetUsername()}
                    placeholder="TU USERNAME..."
                    className="w-full bg-black/5 border-2 border-transparent focus:border-black/10 outline-none rounded-2xl px-6 py-4 text-center font-bold text-sm transition-all"
                    maxLength={15}
                  />
                  <button 
                    onClick={handleSetUsername}
                    disabled={username.trim().length < 3}
                    className="w-full bg-black text-white py-4 rounded-2xl font-black text-xs tracking-widest uppercase hover:scale-[1.02] active:scale-95 transition-all disabled:opacity-30 disabled:pointer-events-none"
                  >
                    ENTRAR A LA SESIÓN
                  </button>
                </div>
             </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen w-full bg-black text-black font-['Avenir_Next_Condensed','Arial_Narrow',sans-serif] selection:bg-black selection:text-white overflow-hidden relative">
          <img src={BACKGROUND_URL} className="fixed inset-0 w-full h-full object-cover opacity-80 z-0" alt="fondo" />
          <div className={`fixed inset-0 z-[5] pointer-events-none transition-all duration-1000 ease-in-out ${isRestMode ? 'bg-indigo-900/30 backdrop-blur-[2px]' : 'bg-transparent'}`} />
          
          <div className="relative z-10 min-h-screen flex flex-col items-center p-4 md:p-8 overflow-x-hidden overflow-y-auto">
            <div className="w-full max-w-5xl space-y-6">
              <header className="text-center py-8">
                <div className="mt-2 mb-4 w-full flex justify-center">
                  <img src={HEADER_BANNER_URL} className="w-full max-w-3xl rounded-[30px] shadow-2xl border border-white/20 hover:scale-[1.01] transition-transform duration-500" alt="Café Internet" />
                </div>
                
                {/* Reproductor de Sonido Embed */}
                <div className="w-full max-w-md mx-auto h-20 mb-6 overflow-hidden rounded-2xl shadow-lg border border-white/20 bg-black/10 backdrop-blur-sm relative group">
                  <iframe 
                    src="https://drive.google.com/file/d/1JJ6ai0TXfR5iV5gBAv_Qx3gSJQnPpnXS/preview" 
                    width="100%" height="100%" className="border-none"
                    style={{ 
                      filter: isRestMode ? 'invert(1) hue-rotate(220deg) brightness(0.9)' : 'invert(1) hue-rotate(180deg) brightness(0.8)', 
                      transform: 'scale(1.3)',
                      pointerEvents: 'auto'
                    }}
                  ></iframe>
                  <div className="absolute top-2 left-2 bg-black/60 px-2 py-0.5 rounded text-[8px] font-black text-white uppercase tracking-widest pointer-events-none">
                    {isRestMode ? 'Lofi Rest' : 'Ambience Player'}
                  </div>
                </div>

                <div className="flex items-center justify-center gap-4 mt-2">
                  <p className="text-[10px] tracking-[0.5em] opacity-60 font-bold uppercase">Productivity Hub</p>
                  <div className="h-[1px] w-12 bg-black/20"></div>
                  <p className="text-[10px] tracking-[0.5em] opacity-60 font-bold uppercase">User: {username}</p>
                </div>
              </header>

              {/* Sección de Créditos Ganados y Estadísticas */}
              <section className={`grid grid-cols-2 md:grid-cols-4 gap-4 transition-all duration-700`}>
                 <div className={`p-4 rounded-[24px] border flex flex-col items-center justify-center transition-colors ${isRestMode ? 'bg-indigo-50/40 border-indigo-200' : 'bg-white/40 border-white/20 backdrop-blur-md'}`}>
                    <span className="text-[9px] font-black tracking-widest opacity-40 uppercase mb-1">Créditos Ganados</span>
                    <div className="flex items-center gap-2">
                       <LucideIcon name="wallet" size={14} className="opacity-60" />
                       <span className="text-xl font-black">${coins}</span>
                    </div>
                 </div>
                 <div className={`p-4 rounded-[24px] border flex flex-col items-center justify-center transition-colors ${isRestMode ? 'bg-indigo-50/40 border-indigo-200' : 'bg-white/40 border-white/20 backdrop-blur-md'}`}>
                    <span className="text-[9px] font-black tracking-widest opacity-40 uppercase mb-1">Experiencia (XP)</span>
                    <span className="text-xl font-black">{score} XP</span>
                 </div>
                 <div className={`p-4 rounded-[24px] border flex flex-col items-center justify-center transition-colors ${isRestMode ? 'bg-indigo-50/40 border-indigo-200' : 'bg-white/40 border-white/20 backdrop-blur-md'}`}>
                    <span className="text-[9px] font-black tracking-widest opacity-40 uppercase mb-1">Items Obtenidos</span>
                    <span className="text-xl font-black">{Object.keys(itemsOwned).length}</span>
                 </div>
                 <div className={`p-4 rounded-[24px] border flex flex-col items-center justify-center transition-colors ${isRestMode ? 'bg-indigo-50/40 border-indigo-200' : 'bg-white/40 border-white/20 backdrop-blur-md'}`}>
                    <span className="text-[9px] font-black tracking-widest opacity-40 uppercase mb-1">Tareas Hechas</span>
                    <span className="text-xl font-black">{tasks.length}</span>
                 </div>
              </section>

              <section className={`rounded-[40px] border border-white/30 p-8 md:p-16 text-center shadow-2xl transition-all duration-700 hover:bg-white/60 ${isRestMode ? 'bg-white/30' : 'bg-white/50 backdrop-blur-xl'}`}>
                <div className={`text-[20vw] md:text-[14rem] font-black tabular-nums leading-none tracking-tighter mb-8 filter drop-shadow-sm transition-colors duration-700 ${isRestMode ? 'text-indigo-900' : 'text-black'}`}>
                  {formatTime(timeLeft)}
                </div>
                <div className="flex flex-col md:flex-row items-center justify-center gap-4">
                  <button onClick={() => setIsPaused(!isPaused)} className={`w-full md:w-auto px-12 py-5 rounded-full text-sm font-bold hover:scale-105 active:scale-95 transition-all shadow-xl flex items-center justify-center gap-3 ${isRestMode ? 'bg-indigo-950 text-white' : 'bg-black text-white'}`}>
                    <LucideIcon name={isPaused ? "play" : "pause"} />
                    {isPaused ? 'INICIAR SESIÓN' : 'PAUSAR ENFOQUE'}
                  </button>
                  <button onClick={() => { const nextMode = !isRestMode; setIsRestMode(nextMode); setTimeLeft(nextMode ? 10 * 60 : 90 * 60); setIsPaused(true); }} className={`w-full md:w-auto border text-black px-12 py-5 rounded-full text-sm font-bold transition-all shadow-lg flex items-center justify-center gap-3 ${isRestMode ? 'bg-indigo-100 border-indigo-200 hover:bg-indigo-200' : 'bg-white/80 border-black/10 hover:bg-white'}`}>
                    <LucideIcon name={isRestMode ? "sun" : "moon"} />
                    {isRestMode ? 'VOLVER AL TRABAJO' : 'TOMAR UN DESCANSO'}
                  </button>
                </div>
              </section>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <section className={`rounded-[32px] p-8 border flex flex-col transition-colors duration-700 ${isRestMode ? 'bg-indigo-50/30 border-indigo-100' : 'bg-white/40 border-white/20 backdrop-blur-md'}`}>
                  <h3 className="text-[10px] font-black tracking-widest opacity-40 mb-6 uppercase">Rutina de Inicio</h3>
                  <div className="grid grid-cols-1 gap-3">
                    {PRE_STUDY_STEPS.map((s, i) => (
                      <button key={i} onClick={() => togglePreStudy(i)} className={`p-4 rounded-2xl flex items-center justify-between text-xs font-bold transition-all border-2 ${preStudy[i] ? (isRestMode ? 'bg-indigo-900 border-indigo-900 text-white shadow-lg' : 'bg-black border-black text-white shadow-lg') : 'bg-white/30 border-transparent hover:bg-white/50 text-black/60'}`}>
                        <span>{s}</span>
                        {preStudy[i] && <LucideIcon name="check" size={14} />}
                      </button>
                    ))}
                  </div>
                </section>

                <section className={`rounded-[32px] p-8 border flex flex-col transition-colors duration-700 ${isRestMode ? 'bg-indigo-50/30 border-indigo-100' : 'bg-white/40 border-white/20 backdrop-blur-md'}`}>
                  <h3 className="text-[10px] font-black tracking-widest opacity-40 mb-6 uppercase">Objetivos de la Sesión</h3>
                  <div className="flex gap-2 mb-6">
                    <input value={newTask} onChange={e => setNewTask(e.target.value)} onKeyDown={e => e.key === 'Enter' && addTask()} className="bg-white/50 flex-1 rounded-2xl px-5 py-4 text-xs font-bold outline-none border-2 border-transparent focus:border-black/20 transition-all placeholder:text-black/30" placeholder="AÑADIR TAREA..." />
                    <button onClick={addTask} className={`w-14 rounded-2xl flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-lg text-white ${isRestMode ? 'bg-indigo-900' : 'bg-black'}`}>
                      <LucideIcon name="plus" />
                    </button>
                  </div>
                  <div className="space-y-3 max-h-60 overflow-y-auto pr-2 custom-scrollbar">
                    {tasks.length === 0 && <p className="text-[10px] opacity-30 italic text-center py-4 uppercase">No hay tareas pendientes</p>}
                    {tasks.map((t, i) => (
                      <div key={i} className="group flex items-center justify-between p-4 bg-white/30 rounded-2xl border border-white/20 hover:bg-white/50 transition-all">
                        <span className="text-[11px] font-bold uppercase tracking-tight">{t}</span>
                        <button onClick={() => removeTask(i)} className="opacity-0 group-hover:opacity-100 p-2 hover:text-red-500 transition-all">
                          <LucideIcon name="trash" size={14} />
                        </button>
                      </div>
                    ))}
                  </div>
                </section>
              </div>

              {/* Ranking Global */}
              <section className={`rounded-3xl p-6 border transition-colors duration-700 ${isRestMode ? 'bg-indigo-50/20 border-indigo-100' : 'bg-white/30 border-white/20 backdrop-blur-xl'}`}>
                 <h3 className="text-[10px] font-black tracking-widest opacity-40 mb-4 text-center uppercase">Global Live Rankings (by XP)</h3>
                 <div className="flex flex-wrap justify-center gap-4">
                    {globalRankings.map((r, i) => (
                      <div key={r.id} className={`flex items-center gap-2 px-4 py-2 rounded-full border transition-all ${r.userId === user?.uid ? 'bg-black text-white border-black scale-110 shadow-lg' : 'bg-white/40 border-white/30'}`}>
                        <span className="text-[10px] font-black opacity-40">#{i+1}</span>
                        <span className="text-[10px] font-bold uppercase">{r.username || "Guest"}</span>
                        <span className={`text-[10px] font-black ${r.userId === user?.uid ? 'text-blue-300' : (isRestMode ? 'text-indigo-700' : 'text-blue-600')}`}>{r.score || 0} XP</span>
                      </div>
                    ))}
                 </div>
              </section>

              {/* Tienda con precios visibles */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pb-20">
                <div className={`p-6 rounded-[32px] border transition-colors duration-700 ${isRestMode ? 'bg-indigo-50/30 border-indigo-100' : 'bg-white/40 border-white/20 backdrop-blur-md'}`}>
                  <div className="flex justify-between items-center mb-4">
                    <p className="text-[10px] font-black tracking-widest opacity-40 uppercase">Tienda de Café</p>
                    <p className="text-xs font-black">${coins}</p>
                  </div>
                  <div className="grid grid-cols-3 gap-3">
                    {SHOP_ITEMS.map(item => (
                      <button 
                        key={item.id} 
                        onClick={() => handleBuy(item)} 
                        className={`relative p-2 rounded-2xl flex flex-col items-center justify-center transition-all ${itemsOwned[item.id] ? 'bg-black/5 opacity-20 grayscale cursor-not-allowed' : 'bg-white/40 hover:bg-white hover:scale-105 shadow-sm active:scale-95'}`}
                      >
                        <span className="text-2xl mb-1">{item.icon}</span>
                        <span className="text-[8px] font-black opacity-60 tracking-tight">${item.price}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <a href={BUY_ME_COFFEE} target="_blank" rel="noopener noreferrer" className={`p-6 rounded-[32px] flex flex-col items-center justify-center text-white hover:scale-105 transition-all shadow-2xl group ${isRestMode ? 'bg-indigo-950' : 'bg-black'}`}>
                  <span className="text-sm font-black tracking-[0.2em] italic mb-1 uppercase group-hover:text-blue-400">APOYA</span>
                  <span className="text-[9px] font-bold opacity-40 uppercase tracking-widest">AYUDA A CREAR OTRAS COSAS</span>
                </a>

                <a href={STICKERS_LINK} target="_blank" rel="noopener noreferrer" className="bg-white/60 backdrop-blur-md p-6 rounded-[32px] flex flex-col items-center justify-center border-2 border-black/5 hover:border-black/20 hover:scale-105 transition-all group">
                  <span className="text-sm font-black tracking-[0.2em] italic mb-1 uppercase group-hover:text-zinc-600 text-black">STICKERS</span>
                  <span className="text-[9px] font-bold opacity-40 uppercase tracking-widest text-black">Download Pack</span>
