<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Café Internet Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.3); border-radius: 10px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 3s linear infinite; }
    .font-display { font-family: 'Black Han Sans', sans-serif; }
    .font-mono-custom { font-family: 'Space Mono', monospace; }
    .bg-main-image {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
        opacity: 0.85;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const BACKGROUND_URL = "https://i.postimg.cc/c4jQkKLG/CAFEINTERNET.jpg";
const STICKERS_LINK = "https://drive.google.com/drive/folders/1w-kdbaZF79AJQZnA66DFvJ8GVqZenckl";
const BUY_ME_COFFEE = "https://buymeacoffee.com/anatonotesp";
const STORAGE_KEY = "cafe-internet-pro-full-data";

const PRE_STUDY_STEPS = ["Botella de agua", "Modo No Molestar", "Escritorio limpio", "Cardio 20 min"];
const SHOP_ITEMS = [
  { id: 'espresso',   name: 'Espresso',      price: 50,   icon: "☕️" },
  { id: 'mac',        name: 'MacBook',       price: 2500, icon: "💻" },
  { id: 'planta',     name: 'Planta Zen',    price: 150,  icon: "🪴" },
  { id: 'audifonos',  name: 'Audífonos',     price: 1200, icon: "🎧" },
  { id: 'croissant',  name: 'Croissant',     price: 65,   icon: "🥐" },
  { id: 'libro',      name: 'Libro',         price: 300,  icon: "📖" },
  { id: 'matcha',     name: 'Matcha Latte',  price: 65,   icon: "🍵" },
  { id: 'boba',       name: 'Boba Tea',      price: 65,   icon: "🧋" },
];

const ICONS = {
  Play: "M5 3l14 9-14 9V3z",
  Pause: ["M6 4h4v16H6z", "M14 4h4v16h-4z"],
  Clock: ["M12 2a10 10 0 100 20A10 10 0 0012 2z", "M12 6v6l4 2"],
  Plus: ["M12 5v14", "M5 12h14"],
  Bag: ["M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z", "M3 6h18", "M16 10a4 4 0 01-8 0"],
  Trophy: "M6 9H2V3h4m12 6h4V3h-4M6 3h12v9a6 6 0 01-12 0V3zM8 21h8m-4-3v3",
  Trash: ["M3 6h18", "M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6", "M9 6V4h6v2"]
};

const Ico = ({ name, size = 20, className = "" }) => {
  const d = ICONS[name];
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      {Array.isArray(d) ? d.map((p, i) => <path key={i} d={p} />) : <path d={d} />}
    </svg>
  );
};

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
}

function App() {
  const initial = loadData() || {};
  const [username, setUsername] = useState(initial.username || "");
  const [timeLeft, setTimeLeft] = useState(90 * 60);
  const [isPaused, setIsPaused] = useState(true);
  const [isRestMode, setIsRestMode] = useState(false);
  const [coins, setCoins] = useState(initial.coins ?? 0);
  const [score, setScore] = useState(initial.score ?? 0);
  const [tasks, setTasks] = useState(initial.tasks ?? []);
  const [newTask, setNewTask] = useState('');
  const [preStudy, setPreStudy] = useState(initial.preStudy ?? [false, false, false, false]);
  const [itemsOwned, setItemsOwned] = useState(initial.itemsOwned ?? {});
  const [sessionEarnings, setSessionEarnings] = useState(0);

  useEffect(() => {
    if (!username) {
      const name = prompt("Introduce tu Username:") || "Invitado";
      setUsername(name);
    }
  }, []);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ coins, score, tasks, preStudy, itemsOwned, username }));
  }, [coins, score, tasks, preStudy, itemsOwned, username]);

  useEffect(() => {
    if (isPaused || timeLeft <= 0) return;
    const timer = setInterval(() => {
      setTimeLeft(t => {
        const next = t - 1;
        if (!isRestMode && next > 0 && t % 60 === 0) {
          setCoins(c => c + 1);
          setScore(s => s + 1);
          setSessionEarnings(e => e + 1);
        }
        return next;
      });
    }, 1000);
    return () => clearInterval(timer);
  }, [isPaused, isRestMode, timeLeft]);

  const toggleMode = () => {
    const next = !isRestMode;
    setIsRestMode(next);
    setTimeLeft(next ? 10 * 60 : 90 * 60);
    setIsPaused(true);
    setSessionEarnings(0);
  };

  const handleBuy = (item) => {
    if (coins >= item.price && !itemsOwned[item.id]) {
      setCoins(coins - item.price);
      setItemsOwned({...itemsOwned, [item.id]: true});
    }
  };

  return (
    <div className="relative min-h-screen w-full flex flex-col items-center p-4 md:p-8 custom-scrollbar overflow-y-auto">
      <img src={BACKGROUND_URL} className="bg-main-image" alt="fondo" />
      <div className={`fixed inset-0 z-[-1] transition-all duration-1000 ${isRestMode ? 'bg-indigo-900/30 backdrop-blur-sm' : 'bg-black/10'}`}></div>

      <div className="w-full max-w-5xl relative z-10">
        
        {/* HEADER */}
        <header className="text-center mb-10">
          <h1 className="font-display text-7xl md:text-9xl text-black drop-shadow-xl leading-none">CAFÉ INTERNET</h1>
          <p className="font-bold tracking-widest text-black/70 uppercase text-[10px]">Productivity Studio by anatonotes</p>
        </header>

        {/* TIMER SECTION */}
        <section className="bg-white/10 backdrop-blur-xl border border-white/30 rounded-[60px] p-10 text-center mb-8 shadow-2xl">
          <div className="flex justify-center items-center gap-3 mb-4">
            <Ico name="Clock" className={isPaused ? "text-black/40" : "text-black animate-spin"} />
            <span className="text-xs font-bold uppercase tracking-[0.2em] text-black">{isRestMode ? 'Descanso' : 'Enfoque'}</span>
          </div>
          <div className="text-[10rem] md:text-[14rem] font-bold text-black leading-none mb-10 tabular-nums select-none">
            {Math.floor(timeLeft/60).toString().padStart(2,'0')}:{(timeLeft%60).toString().padStart(2,'0')}
          </div>
          <div className="flex flex-wrap justify-center gap-4">
            <button onClick={() => setIsPaused(!isPaused)} className="bg-black text-white px-14 py-5 rounded-full font-bold text-xs uppercase hover:scale-105 transition-all shadow-xl">
              {isPaused ? 'Iniciar' : 'Pausar'}
            </button>
            <button onClick={toggleMode} className="bg-white/50 text-black px-10 py-5 rounded-full font-bold text-xs uppercase border border-white/40 hover:bg-white transition-all shadow-xl">
              {isRestMode ? 'Modo Estudio' : 'Modo Descanso'}
            </button>
          </div>
        </section>

        {/* STATS & RANKING */}
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div className="bg-black text-white p-8 rounded-[40px] shadow-2xl col-span-1 md:col-span-2 border border-blue-500/30">
            <div className="flex justify-between items-center mb-6">
              <h3 className="font-display text-2xl text-blue-400 italic uppercase">Global Ranking</h3>
              <span className="text-[10px] text-green-400 font-bold animate-pulse">● LIVE</span>
            </div>
            <div className="space-y-3">
              <div className="flex items-center justify-between p-4 bg-blue-600/20 border border-blue-500/50 rounded-2xl">
                <span className="font-bold text-blue-400 text-xs">#YOU</span>
                <span className="font-bold uppercase text-sm">{username}</span>
                <span className="font-mono font-bold text-blue-400">{score} pts</span>
              </div>
              <div className="h-[1px] bg-white/10 my-4"></div>
              {[{n:'AnatoNotes', s:5000}, {n:'StudyGhost', s:3200}].map((u, i) => (
                <div key={i} className="flex justify-between text-xs opacity-50 px-2 font-bold uppercase">
                  <span>0{i+1} {u.n}</span>
                  <span>{u.s} pts</span>
                </div>
              ))}
            </div>
          </div>
          <div className="bg-white/90 backdrop-blur-xl p-8 rounded-[40px] shadow-2xl flex flex-col justify-center items-center">
            <p className="text-[10px] font-bold uppercase opacity-40 mb-2">Billetera</p>
            <div className="text-7xl font-black text-black italic">{coins}$</div>
            <p className="text-[10px] mt-4 font-bold opacity-40 uppercase tracking-tighter">+{sessionEarnings} esta sesión</p>
          </div>
        </div>

        {/* TIENDA Y STICKERS */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
          <section className="bg-white/40 backdrop-blur-md p-8 rounded-[40px] border border-white/40 shadow-xl">
            <h3 className="text-xs font-bold uppercase mb-6 flex items-center gap-2"><Ico name="Bag" size={16}/> Menú del Café</h3>
            <div className="grid grid-cols-2 gap-3">
              {SHOP_ITEMS.map(item => (
                <button key={item.id} onClick={() => handleBuy(item)} disabled={itemsOwned[item.id]}
                  className={`p-4 rounded-2xl text-left transition-all border ${itemsOwned[item.id] ? 'bg-black/5 border-transparent opacity-50' : 'bg-white/60 border-white hover:border-black'}`}>
                  <div className="text-xl mb-1">{item.icon}</div>
                  <div className="text-[10px] font-bold uppercase">{item.name}</div>
                  <div className="text-[10px] opacity-50">{item.price}$</div>
                </button>
              ))}
            </div>
          </section>
          
          <section className="bg-black/90 p-8 rounded-[40px] shadow-2xl flex flex-col justify-center items-center text-center">
            <h3 className="text-blue-400 font-display text-2xl italic mb-4 uppercase">Stickers Gratis</h3>
            <p className="text-white/60 text-[10px] uppercase font-bold mb-6">Descarga el pack oficial de Anatonotes</p>
            <a href={STICKERS_LINK} target="_blank" className="bg-blue-600 text-white w-full py-4 rounded-2xl font-bold text-xs uppercase hover:bg-blue-500 transition-all">Descargar Pack</a>
            <a href={BUY_ME_COFFEE} target="_blank" className="mt-4 text-white/40 text-[10px] font-bold hover:text-white uppercase">Apoyar el proyecto ☕️</a>
          </section>
        </div>

        {/* TAREAS Y RUTINA */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-20">
          <div className="bg-white/30 backdrop-blur-md p-8 rounded-[40px] border border-white/20">
            <h4 className="text-[10px] font-bold uppercase mb-6 opacity-60 italic">Checklist de Inicio</h4>
            {PRE_STUDY_STEPS.map((step, i) => (
              <div key={i} onClick={() => {const n=[...preStudy]; n[i]=!n[i]; setPreStudy(n);}}
                className={`p-4 mb-2 rounded-2xl cursor-pointer text-[10px] font-bold transition-all border ${preStudy[i] ? 'bg-black text-white border-black' : 'bg-white/40 border-transparent text-black/50 hover:border-black/20'}`}>
                {step} {preStudy[i] && '✓'}
              </div>
            ))}
          </div>
          <div className="bg-white/30 backdrop-blur-md p-8 rounded-[40px] border border-white/20 flex flex-col">
            <h4 className="text-[10px] font-bold uppercase mb-6 opacity-60 italic">Misión del día</h4>
            <div className="flex gap-2 mb-4">
              <input value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==='Enter' && (setTasks([...tasks, newTask]), setNewTask(''))}
                className="bg-white/50 flex-1 rounded-xl px-4 py-3 text-[10px] font-bold outline-none border border-transparent focus:border-black uppercase" placeholder="Escribir tarea..." />
              <button onClick={()=>{setTasks([...tasks, newTask]); setNewTask('');}} className="bg-black text-white px-4 rounded-xl font-bold">+</button>
            </div>
            <div className="space-y-2 overflow-y-auto max-h-40 custom-scrollbar">
              {tasks.map((t, i) => (
                <div key={i} className="flex justify-between items-center bg-white/40 p-3 rounded-xl">
                  <span className="text-[10px] font-bold uppercase opacity-70">{t}</span>
                  <button onClick={()=>setTasks(tasks.filter((_,idx)=>idx!==i))} className="text-black/30 hover:text-red-500">×</button>
                </div>
              ))}
            </div>
          </div>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
